[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.version]
path = "oc_ref_bot/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["oc_ref_bot"]

[project]
name = "oc_ref_bot"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "aiogram==3.12.*",
    "aiohttp_socks==0.10.1",
    "pydantic-settings==2.4.*",
    "SQLAlchemy==1.4.*",
    "aiopg==1.4.*",
    "sentry-sdk==2.13.*",
    "numpy==2.2.*",
    "opencv-python==4.11.0.*",
    "pillow==11.1.*",
    "psutil==7.0.*"
]

[project.optional-dependencies]
test = [
    "ruff",
    "testcontainers==4.10.0",
    "coverage==7.8.0",
    "pytest-env==1.1.5",
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0"
]

[project.scripts]
start-bot = "oc_ref_bot.main:main"

[tool.black]
line-length = 120
target-version = ['py312']

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "ANN001",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN206",
    "A",
    "ARG",
    "B904",
    "BLE",
    "C",
    "COM",
    "E",
    "ERA",
    "F",
    "FBT",
    "I",
    "ISC",
    "W",
    "N",
    "NPY",
    "PD",
    "PIE",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "RET",
    "RSE",
    "RUF",
    "Q",
    "SIM",
    "T",
    "TCH",
    "UP",
    "DTZ001",
    "DTZ005",
    "DTZ006",
    "DTZ007",
    "DTZ012",
]
ignore = ["COM812", "RUF001", "RUF100", "RUF003"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "single"
inline-quotes = "single"

[tool.pytest.ini_options]
asyncio_mode = "auto"
env = [
    "BOT_TOKEN=123456789:3cf4795c9a63ccccf6d88a9f0893151dbeb",
    "ADMIN_ID=194573162",
    "SENTRY_DSN=http://localhost/",
    "DB_USER=test",
    "DB_PASS=test",
    "DB_HOST=localhost",
    "DB_DB=test"
]
